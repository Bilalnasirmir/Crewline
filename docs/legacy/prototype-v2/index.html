<title>Crewline Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* ============ TOKENS ============ */
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --subtle:#F5F6F8; --subtle-2:#FBFBFC; --hover:#F1F3F7;
  --ink:#0B0B0C; --ink-2:#3A3B40; --muted:#6B6B6B; --faint:#9B9CA3;
  --line:#E5E8EF; --line-2:#EFF1F5; --line-strong:#D3D9E4;
  --primary:#266DF0; --primary-hover:#1E57C0; --primary-soft:#EAF1FE; --primary-text:#1E57C0; --on-primary:#FFFFFF;
  --ai:#6E47E6; --ai-soft:#F2EEFE; --ai-line:#E3DAFD;
  --good:#15803D; --good-soft:#E6F5EB; --warn:#A15C07; --warn-soft:#FDF3DF; --bad:#D92D20; --bad-soft:#FDECEA;
  --out:#C2410C; --out-soft:#FDEEE5; --in:#0F766E; --in-soft:#E1F3F0;
  --side:#FAFAFB; --side-ink:#3A3B40; --side-muted:#8A8C94; --side-hover:#EFF1F5; --side-act:#EAF1FE; --side-act-ink:#1E57C0; --side-line:#ECEEF2;
  --tip:#16171B; --tip-ink:#FFFFFF;
  --pop:0 10px 30px rgba(16,24,40,.12),0 1px 3px rgba(16,24,40,.08);
  --r-sm:6px; --r:8px; --r-card:12px;
  --f:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --fast:100ms; --std:160ms; --slow:200ms; --ease:ease-in-out;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0F1013; --surface:#16171C; --subtle:#1C1E24; --subtle-2:#14151A; --hover:#23262D;
  --ink:#F3F4F6; --ink-2:#CDD0D6; --muted:#9A9DA6; --faint:#6E717B;
  --line:#272A31; --line-2:#1F2127; --line-strong:#353943;
  --primary:#4C8BF5; --primary-hover:#6B9FF7; --primary-soft:#172440; --primary-text:#8DB6FA; --on-primary:#FFFFFF;
  --ai:#A18BFF; --ai-soft:#231C3F; --ai-line:#3A2F68;
  --good:#4ADE80; --good-soft:#13291C; --warn:#FACC15; --warn-soft:#2E2710; --bad:#F87171; --bad-soft:#3A1818;
  --out:#FB923C; --out-soft:#35200F; --in:#2DD4BF; --in-soft:#0F2E2A;
  --side:#121317; --side-ink:#D4D6DC; --side-muted:#80838C; --side-hover:#1D1F25; --side-act:#1A2640; --side-act-ink:#9DBEFB; --side-line:#1F2127;
  --tip:#F3F4F6; --tip-ink:#0F1013; --pop:0 10px 30px rgba(0,0,0,.5),0 1px 3px rgba(0,0,0,.4);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F1013; --surface:#16171C; --subtle:#1C1E24; --subtle-2:#14151A; --hover:#23262D;
  --ink:#F3F4F6; --ink-2:#CDD0D6; --muted:#9A9DA6; --faint:#6E717B;
  --line:#272A31; --line-2:#1F2127; --line-strong:#353943;
  --primary:#4C8BF5; --primary-hover:#6B9FF7; --primary-soft:#172440; --primary-text:#8DB6FA; --on-primary:#FFFFFF;
  --ai:#A18BFF; --ai-soft:#231C3F; --ai-line:#3A2F68;
  --good:#4ADE80; --good-soft:#13291C; --warn:#FACC15; --warn-soft:#2E2710; --bad:#F87171; --bad-soft:#3A1818;
  --out:#FB923C; --out-soft:#35200F; --in:#2DD4BF; --in-soft:#0F2E2A;
  --side:#121317; --side-ink:#D4D6DC; --side-muted:#80838C; --side-hover:#1D1F25; --side-act:#1A2640; --side-act-ink:#9DBEFB; --side-line:#1F2127;
  --tip:#F3F4F6; --tip-ink:#0F1013; --pop:0 10px 30px rgba(0,0,0,.5),0 1px 3px rgba(0,0,0,.4);
}
/* app-chosen themes (Settings → Appearance, or ask Max) */
body.th-light{color-scheme:light;
  --bg:#FFFFFF; --surface:#FFFFFF; --subtle:#F5F6F8; --subtle-2:#FBFBFC; --hover:#F1F3F7; --ink:#0B0B0C; --ink-2:#3A3B40; --muted:#6B6B6B; --faint:#9B9CA3; --line:#E5E8EF; --line-2:#EFF1F5; --line-strong:#D3D9E4;
  --primary:#266DF0; --primary-hover:#1E57C0; --primary-soft:#EAF1FE; --primary-text:#1E57C0; --ai:#6E47E6; --ai-soft:#F2EEFE; --ai-line:#E3DAFD;
  --good:#15803D; --good-soft:#E6F5EB; --warn:#A15C07; --warn-soft:#FDF3DF; --bad:#D92D20; --bad-soft:#FDECEA; --out:#C2410C; --out-soft:#FDEEE5; --in:#0F766E; --in-soft:#E1F3F0;
  --side:#FAFAFB; --side-ink:#3A3B40; --side-muted:#8A8C94; --side-hover:#EFF1F5; --side-act:#EAF1FE; --side-act-ink:#1E57C0; --side-line:#ECEEF2; --tip:#16171B; --tip-ink:#FFFFFF; --pop:0 10px 30px rgba(16,24,40,.12),0 1px 3px rgba(16,24,40,.08);}
body.th-dark{color-scheme:dark;
  --bg:#0F1013; --surface:#16171C; --subtle:#1C1E24; --subtle-2:#14151A; --hover:#23262D; --ink:#F3F4F6; --ink-2:#CDD0D6; --muted:#9A9DA6; --faint:#6E717B; --line:#272A31; --line-2:#1F2127; --line-strong:#353943;
  --primary:#4C8BF5; --primary-hover:#6B9FF7; --primary-soft:#172440; --primary-text:#8DB6FA; --ai:#A18BFF; --ai-soft:#231C3F; --ai-line:#3A2F68;
  --good:#4ADE80; --good-soft:#13291C; --warn:#FACC15; --warn-soft:#2E2710; --bad:#F87171; --bad-soft:#3A1818; --out:#FB923C; --out-soft:#35200F; --in:#2DD4BF; --in-soft:#0F2E2A;
  --side:#121317; --side-ink:#D4D6DC; --side-muted:#80838C; --side-hover:#1D1F25; --side-act:#1A2640; --side-act-ink:#9DBEFB; --side-line:#1F2127; --tip:#F3F4F6; --tip-ink:#0F1013; --pop:0 10px 30px rgba(0,0,0,.5),0 1px 3px rgba(0,0,0,.4);}
body.th-navy{color-scheme:dark;
  --bg:#0A1328; --surface:#0F1B37; --subtle:#132344; --subtle-2:#0D1832; --hover:#1A2C54; --ink:#EAF0FF; --ink-2:#C6D1EE; --muted:#8F9DC2; --faint:#65739A; --line:#1D2D55; --line-2:#16264A; --line-strong:#2A3E6E;
  --primary:#5B8DFF; --primary-hover:#7DA5FF; --primary-soft:#172D5E; --primary-text:#A3C0FF; --ai:#AE97FF; --ai-soft:#221F52; --ai-line:#3A3478;
  --good:#4ADE80; --good-soft:#0F2E2A; --warn:#FACC15; --warn-soft:#2B2A20; --bad:#FB8A80; --bad-soft:#3A1C2A; --out:#FDA35A; --out-soft:#35252A; --in:#34D8C2; --in-soft:#0E2F3A;
  --side:#08112A; --side-ink:#C9D5F5; --side-muted:#7483AB; --side-hover:#122247; --side-act:#1A3068; --side-act-ink:#FFFFFF; --side-line:#14224A; --tip:#EAF0FF; --tip-ink:#0A1328; --pop:0 10px 30px rgba(0,0,0,.55),0 1px 3px rgba(0,0,0,.4);}
body.th-mixed{color-scheme:light;
  --bg:#FFFFFF; --surface:#FFFFFF; --subtle:#F5F6F8; --subtle-2:#FBFBFC; --hover:#F1F3F7; --ink:#0B0B0C; --ink-2:#3A3B40; --muted:#6B6B6B; --faint:#9B9CA3; --line:#E5E8EF; --line-2:#EFF1F5; --line-strong:#D3D9E4;
  --primary:#266DF0; --primary-hover:#1E57C0; --primary-soft:#EAF1FE; --primary-text:#1E57C0; --ai:#6E47E6; --ai-soft:#F2EEFE; --ai-line:#E3DAFD;
  --good:#15803D; --good-soft:#E6F5EB; --warn:#A15C07; --warn-soft:#FDF3DF; --bad:#D92D20; --bad-soft:#FDECEA; --out:#C2410C; --out-soft:#FDEEE5; --in:#0F766E; --in-soft:#E1F3F0;
  --side:#111318; --side-ink:#D6D8DE; --side-muted:#80838C; --side-hover:#1C1F26; --side-act:#1F2C4A; --side-act-ink:#FFFFFF; --side-line:#1E2128; --tip:#16171B; --tip-ink:#FFFFFF; --pop:0 10px 30px rgba(16,24,40,.12),0 1px 3px rgba(16,24,40,.08);}

/* ============ BASE ============ */
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:400 14px/1.5 var(--f);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--primary-text)}
:focus-visible{outline:1px solid var(--primary);outline-offset:1px;box-shadow:0 0 0 3px var(--primary-soft)}
.ic{flex:none;display:inline-block;vertical-align:-.2em}
h1{font-size:24px;line-height:1.25;font-weight:700;margin:0;letter-spacing:-.015em;text-wrap:balance}
h2{font-size:20px;line-height:1.3;font-weight:700;margin:0;letter-spacing:-.01em;text-wrap:balance}
h3{font-size:14px;line-height:1.4;font-weight:600;margin:0}
h4{font-size:13px;font-weight:600;margin:0}
p{margin:0}
.muted{color:var(--muted)}.faint{color:var(--faint)}
.small{font-size:12px}.xs{font-size:11px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:12px}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row.nw{flex-wrap:nowrap}
.between{justify-content:space-between}
.col{display:flex;flex-direction:column;gap:8px}
.stack{display:flex;flex-direction:column;gap:16px}
.stack-s{display:flex;flex-direction:column;gap:8px}
.stack-l{display:flex;flex-direction:column;gap:24px}
.grow{flex:1;min-width:0}
.hide{display:none!important}
.trunc{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}

/* ============ SHELL ============ */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);height:100%;transition:grid-template-columns var(--std) var(--ease)}
.app.col{grid-template-columns:60px minmax(0,1fr)}
.side{background:var(--side);border-right:1px solid var(--side-line);display:flex;flex-direction:column;min-height:0;z-index:10000}
.side-top{display:flex;align-items:center;gap:8px;padding:12px 12px 8px;height:52px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;color:var(--side-ink);letter-spacing:-.01em;min-width:0}
.mark{width:28px;height:28px;border-radius:8px;background:var(--primary);color:#fff;display:grid;place-items:center;flex:none}
.side-toggle{margin-left:auto;width:28px;height:28px;border-radius:6px;border:0;background:none;color:var(--side-muted);display:grid;place-items:center}
.side-toggle:hover{background:var(--side-hover);color:var(--side-ink)}
.app.col .brand span,.app.col .nav .lbl,.app.col .nav .cnt,.app.col .side-foot .lbl,.app.col .nav-sec{display:none}
.app.col .side-top{flex-direction:column;height:auto;gap:8px;padding:12px 0 8px}
.app.col .side-toggle{margin:0}
.nav{display:flex;flex-direction:column;gap:2px;padding:4px 8px;overflow-y:auto;flex:1}
.nav-sec{font-size:11px;font-weight:600;color:var(--side-muted);padding:12px 8px 4px;letter-spacing:.04em}
.nav button{display:flex;align-items:center;gap:10px;height:32px;padding:0 8px;border-radius:6px;border:0;background:none;color:var(--side-ink);font-size:13.5px;font-weight:500;text-align:left;width:100%;transition:background var(--fast) var(--ease)}
.nav button:hover{background:var(--side-hover)}
.nav button.on{background:var(--side-act);color:var(--side-act-ink)}
.nav button .ic{color:currentColor;opacity:.9}
.app.col .nav button{justify-content:center;padding:0}
.nav .cnt{margin-left:auto;font-size:11px;font-weight:600;color:var(--bad);background:var(--bad-soft);border-radius:5px;padding:0 6px;line-height:18px}
.nav .cnt.ai{color:var(--ai);background:var(--ai-soft)}
.side-foot{padding:8px;border-top:1px solid var(--side-line);display:flex;flex-direction:column;gap:2px}
.mainwrap{display:flex;flex-direction:column;min-width:0;min-height:0;height:100%}
.top{height:52px;flex:none;display:flex;align-items:center;gap:8px;padding:0 20px;border-bottom:1px solid var(--line);background:var(--surface);z-index:500}
.crumbs{display:flex;align-items:center;gap:6px;font-size:13.5px;color:var(--muted);min-width:0}
.crumbs b{color:var(--ink);font-weight:600}
.cmdbtn{display:flex;align-items:center;gap:8px;height:32px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:var(--subtle-2);color:var(--faint);width:min(380px,32vw);text-align:left;font-size:13px}
.cmdbtn:hover{border-color:var(--line-strong)}
.cmdbtn span:not(.kbd){flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kbd{font:500 11px var(--mono);border:1px solid var(--line);border-radius:4px;padding:0 5px;color:var(--faint);background:var(--surface);flex:none}
.livedot{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--good);font-weight:500;border:0;background:none;padding:4px 8px;border-radius:6px}
.livedot:hover{background:var(--hover)}
.livedot i{width:7px;height:7px;border-radius:50%;background:var(--good);box-shadow:0 0 0 3px var(--good-soft)}
.livedot.off{color:var(--faint)}.livedot.off i{background:var(--faint);box-shadow:none}
.me{width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:600;font-size:11.5px;flex:none}
#main{flex:1;overflow-y:auto;min-height:0;position:relative}
#main.flush{overflow:hidden}
.page{max-width:1320px;margin:0 auto;padding:24px 28px 64px}
.page.wide{max-width:none}
.ph{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.ph .sub{color:var(--muted);margin-top:4px;max-width:72ch}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);background:none;border:0;padding:0;margin-bottom:12px;font-size:13px;font-weight:500}
.back:hover{color:var(--ink)}

/* ============ CONTROLS ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:13px;font-weight:500;white-space:nowrap;transition:background var(--fast) var(--ease),border-color var(--fast) var(--ease),color var(--fast) var(--ease)}
.btn:hover{background:var(--hover);border-color:var(--line-strong)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn.primary:hover{background:var(--primary-hover);border-color:var(--primary-hover)}
.btn.ai{background:var(--ai-soft);border-color:var(--ai-line);color:var(--ai)}
.btn.ai:hover{border-color:var(--ai)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--hover)}
.btn.danger{color:var(--bad)}
.btn.danger.fill{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.link{border:0;background:none;color:var(--primary-text);padding:0;height:auto}
.btn.link:hover{text-decoration:underline;background:none}
.btn.sm{height:28px;padding:0 10px;font-size:12.5px;border-radius:7px}
.btn.xs{height:24px;padding:0 8px;font-size:12px;border-radius:6px}
.btn.lg{height:40px;padding:0 16px;font-size:14px}
.btn.icon{width:32px;padding:0}
.btn.icon.sm{width:28px}
.btn.icon.xs{width:24px}
.btn.on{background:var(--primary-soft);border-color:var(--primary);color:var(--primary-text)}
.in{height:32px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);padding:0 10px;width:100%;min-width:0;font-size:13.5px;transition:border-color var(--fast) var(--ease)}
.in:hover{border-color:var(--line-strong)}
.in:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
select.in{padding-right:26px}
textarea.in{height:auto;min-height:84px;padding:8px 10px;resize:vertical;line-height:1.5}
.in.sm{height:28px;font-size:12.5px}
.in.auto{width:auto}
.in[readonly]{background:var(--subtle-2);color:var(--muted)}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld>.btn,.fld>.row>.btn:only-child{align-self:flex-start}
.fld>label,.lbl{font-size:12.5px;font-weight:500;color:var(--ink-2)}
.help{font-size:12px;color:var(--muted)}
.errtxt{font-size:12px;color:var(--bad)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px 16px}
.fgrid.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.fgrid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.span2{grid-column:span 2}.spanall{grid-column:1/-1}
input[type=checkbox],input[type=radio]{accent-color:var(--primary);width:15px;height:15px;cursor:pointer;margin:0}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer}
.sw{position:relative;width:32px;height:18px;flex:none;display:inline-block}
.sw input{opacity:0;position:absolute;inset:0;margin:0;cursor:pointer;z-index:1;width:100%;height:100%}
.sw span{position:absolute;inset:0;background:var(--line-strong);border-radius:18px;transition:background var(--std) var(--ease)}
.sw span::after{content:'';position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform var(--std) var(--ease);box-shadow:0 1px 2px rgba(0,0,0,.2)}
.sw input:checked+span{background:var(--primary)}
.sw input:checked+span::after{transform:translateX(14px)}
.sw input:focus-visible+span{box-shadow:0 0 0 3px var(--primary-soft)}
.seg{display:inline-flex;background:var(--subtle);border-radius:8px;padding:2px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;height:26px;padding:0 10px;border-radius:6px;font-size:12.5px;font-weight:500;color:var(--muted);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto}
.tab{height:36px;padding:0 10px;border:0;background:none;color:var(--muted);font-size:13.5px;font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink);border-color:var(--primary)}
.tab .n{font-size:11px;color:var(--muted);background:var(--subtle);border-radius:5px;padding:0 5px}
.choice{display:flex;flex-wrap:wrap;gap:6px}
.choice button{height:30px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:0 12px;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.choice button:hover{border-color:var(--line-strong)}
.choice button.on{border-color:var(--primary);background:var(--primary-soft);color:var(--primary-text)}
.search{position:relative;min-width:0}
.search>.ic{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--faint);pointer-events:none}
.search .in{padding-left:32px}
.search.big .in{height:40px;font-size:14.5px;padding-left:38px;border-radius:10px}
.search.big>.ic{left:12px}

/* ============ SURFACES ============ */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 20px;border-bottom:1px solid var(--line-2);flex-wrap:wrap;min-height:52px}
.card-b{padding:20px}
.card-b.tight{padding:12px 20px}
.pad{padding:24px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.gauto{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.split{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
.split-l{display:grid;grid-template-columns:260px minmax(0,1fr);gap:20px;align-items:start}
.sticky{position:sticky;top:16px}
.note{font-size:12.5px;color:var(--ink-2);background:var(--subtle-2);border:1px dashed var(--line-strong);padding:8px 12px;border-radius:8px}
.banner{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:10px;border:1px solid var(--line);background:var(--subtle-2);flex-wrap:wrap}
.banner.ai{background:var(--ai-soft);border-color:var(--ai-line)}
.banner.warn{background:var(--warn-soft);border-color:transparent}
.banner.bad{background:var(--bad-soft);border-color:transparent}
.banner .t{font-weight:600}
.divider{height:1px;background:var(--line-2);margin:4px 0}
.empty{padding:32px 16px;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:10px}

/* ============ BADGES / TAGS ============ */
.bdg{display:inline-flex;align-items:center;gap:4px;height:20px;font-size:11.5px;font-weight:500;padding:0 7px;border-radius:5px;background:var(--subtle);color:var(--ink-2);white-space:nowrap;line-height:1}
.bdg .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.bdg.blue{background:var(--primary-soft);color:var(--primary-text)}
.bdg.good{background:var(--good-soft);color:var(--good)}
.bdg.warn{background:var(--warn-soft);color:var(--warn)}
.bdg.bad{background:var(--bad-soft);color:var(--bad)}
.bdg.ai{background:var(--ai-soft);color:var(--ai)}
.bdg.line{background:transparent;border:1px solid var(--line)}
.dir{display:inline-flex;align-items:center;gap:4px;height:20px;font-size:11.5px;font-weight:600;padding:0 6px;border-radius:5px;white-space:nowrap}
.dir.out{background:var(--out-soft);color:var(--out)}
.dir.in{background:var(--in-soft);color:var(--in)}
.dir.both{background:var(--subtle);color:var(--ink-2)}
.diric{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:5px;flex:none}
.diric.out{background:var(--out-soft);color:var(--out)}
.diric.in{background:var(--in-soft);color:var(--in)}
.plat{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:5px;flex:none;background:var(--subtle);color:var(--ink-2)}
.plat.lg{width:28px;height:28px;border-radius:7px}
.p-sms{color:#16A34A}.p-wa{color:#0F9D58}.p-ig{color:#D6336C}.p-msg{color:#266DF0}.p-tt{color:#111}.p-fb{color:#3B5BDB}.p-chat{color:#7048E8}.p-email{color:#C2410C}.p-call{color:#0F766E}
body.th-dark .p-tt,body.th-navy .p-tt{color:#eee}
.ai-tag{display:inline-flex;align-items:center;gap:3px;height:20px;font-size:11.5px;font-weight:500;color:var(--ai);background:var(--ai-soft);padding:0 6px;border-radius:5px;white-space:nowrap;border:0;cursor:pointer}
.ai-tag:hover{box-shadow:0 0 0 1px var(--ai-line)}
.hu-tag{display:inline-flex;align-items:center;gap:3px;height:20px;font-size:11.5px;font-weight:500;color:var(--primary-text);background:var(--primary-soft);padding:0 6px;border-radius:5px;white-space:nowrap}
.aimark{display:inline-grid;place-items:center;color:var(--ai)}
.av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:11px;flex:none;background:var(--subtle);color:var(--ink-2);border:1px solid var(--line)}
.av.sm{width:22px;height:22px;font-size:10px}
.av.lg{width:44px;height:44px;font-size:15px}
.av.xl{width:56px;height:56px;font-size:18px}
.av.bot{border-radius:8px;background:var(--ai-soft);color:var(--ai);border-color:var(--ai-line)}
.nm{display:flex;align-items:center;gap:8px;min-width:0}
.lnk{background:none;border:0;padding:0;color:inherit;font-weight:500;text-align:left}
.lnk:hover{color:var(--primary-text);text-decoration:underline}
.stg{display:inline-flex;align-items:center;gap:5px;height:20px;font-size:11.5px;font-weight:500;padding:0 7px;border-radius:5px;background:var(--subtle);color:var(--ink-2);white-space:nowrap;border:0}
.stg i{width:7px;height:7px;border-radius:2px;flex:none}

/* ============ TABLES ============ */
.tw{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:13px}
.t th{text-align:left;font-weight:500;color:var(--muted);font-size:12px;padding:0 12px;height:34px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--subtle-2);position:sticky;top:0;z-index:1}
.t td{padding:0 12px;height:40px;border-bottom:1px solid var(--line-2);white-space:nowrap;vertical-align:middle}
.t.compact td{height:34px}
.t tr:last-child td{border-bottom:0}
.t tbody tr{transition:background var(--fast) var(--ease)}
.t tbody tr:hover td{background:var(--subtle-2)}
.t tr.click{cursor:pointer}
.t tr.sel td{background:var(--primary-soft)}
.t .cb{width:36px}
.t .r{text-align:right}
.t td.wrap{white-space:normal;padding-top:8px;padding-bottom:8px}

/* ============ KPI / CHARTS ============ */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:2px;text-align:left;color:inherit;transition:border-color var(--fast) var(--ease)}
button.kpi:hover{border-color:var(--primary)}
.kpi .l{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.kpi .v{font-size:22px;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums;line-height:1.3}
.kpi .d{font-size:12px;color:var(--good)}
.kpi .d.neg{color:var(--bad)}
.kpi .d.mut{color:var(--muted)}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{fill:var(--faint);font:11px var(--f)}
.chart .gl{stroke:var(--line-2)}
.chart .bar{fill:var(--primary);opacity:.3;transition:opacity var(--fast)}
.chart .bar:hover,.chart .bar.end{opacity:1}
.chart .bar.b2{fill:var(--ai)}
.chart .ln{fill:none;stroke:var(--primary);stroke-width:2}
.chart .area{fill:var(--primary);opacity:.08}
.meter{height:6px;border-radius:4px;background:var(--subtle);overflow:hidden}
.meter i{display:block;height:100%;background:var(--primary);border-radius:4px}
.meter.ai i{background:var(--ai)}.meter.good i{background:var(--good)}.meter.warn i{background:var(--warn)}.meter.bad i{background:var(--bad)}
.hbar{display:grid;grid-template-columns:140px minmax(0,1fr) 64px;gap:12px;align-items:center;font-size:13px;height:28px}
.hbar .b{height:20px;background:var(--subtle);border-radius:5px;overflow:hidden}
.hbar .b i{display:block;height:100%;background:var(--primary);opacity:.85;border-radius:5px}
.ring{--p:70;width:64px;height:64px;border-radius:50%;background:conic-gradient(var(--c,var(--primary)) calc(var(--p)*1%),var(--subtle) 0);display:grid;place-items:center;flex:none}
.ring::before{content:'';width:50px;height:50px;border-radius:50%;background:var(--surface);grid-area:1/1}
.ring b{grid-area:1/1;font-size:15px;font-weight:700;z-index:1}
.ring.lg{width:88px;height:88px}.ring.lg::before{width:70px;height:70px}.ring.lg b{font-size:20px}

/* ============ LIST ROWS ============ */
.lr{display:flex;align-items:center;gap:10px;padding:10px 20px;border-bottom:1px solid var(--line-2);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left;color:inherit;font-size:13px}
.lr:last-child{border-bottom:0}
button.lr:hover{background:var(--subtle-2)}
.lr .m{flex:1;min-width:0}
.lr .t1{font-weight:500}
.lr .t2{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.optrow{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 0;border-bottom:1px solid var(--line-2)}
.optrow:last-child{border-bottom:0}
.optrow .t{font-weight:500;font-size:13.5px}
.optrow .d{font-size:12px;color:var(--muted)}
.group-h{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--muted);padding:14px 0 4px;text-transform:uppercase;letter-spacing:.05em}

/* ============ LIST EDITOR (sentence entries) ============ */
.led{border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.led-i{display:grid;grid-template-columns:22px minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:6px 8px 6px 10px;border-bottom:1px solid var(--line-2);font-size:13px}
.led-i .n{font-size:11.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.led-i .x{border:0;background:none;color:var(--faint);width:22px;height:22px;border-radius:5px;display:grid;place-items:center}
.led-i .x:hover{color:var(--bad);background:var(--bad-soft)}
.led-add{display:flex;align-items:center;gap:6px;padding:4px 6px 4px 10px}
.led-add input{border:0;background:none;height:30px;flex:1;min-width:0;font-size:13px}
.led-add input:focus{outline:none}
.led:focus-within{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}

/* ============ AI INPUT ============ */
.aibox{display:flex;align-items:flex-end;gap:6px;border:1px solid var(--line);border-radius:12px;padding:6px 6px 6px 12px;background:var(--surface)}
.aibox:focus-within{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.aibox textarea,.aibox input{flex:1;border:0;background:none;resize:none;min-height:32px;max-height:160px;padding:6px 0;font-size:14px;line-height:1.5;min-width:0}
.aibox textarea:focus,.aibox input:focus{outline:none}
.aibox .lead{color:var(--ai);align-self:center}
.mic.rec{background:var(--bad-soft);border-color:var(--bad);color:var(--bad);animation:pulse 1s var(--ease) infinite}
@keyframes pulse{50%{box-shadow:0 0 0 4px var(--bad-soft)}}
.sugg{display:flex;gap:6px;flex-wrap:wrap}
.sugg button{height:28px;border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:0 10px;font-size:12.5px;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px}
.sugg button:hover{border-color:var(--ai-line);color:var(--ai)}

/* ============ CHAT (Max, builder, test) ============ */
.chat{display:flex;flex-direction:column;gap:16px}
.cm{display:flex;gap:10px;align-items:flex-start;max-width:100%}
.cm.u{justify-content:flex-end}
.cm .bb{max-width:min(620px,88%);line-height:1.55;font-size:14px}
.cm.u .bb{background:var(--subtle);border-radius:12px 12px 4px 12px;padding:8px 12px}
.cm.x .bb{padding-top:3px;min-width:0}
.cm.x .bb>*+*{margin-top:10px}
.cm .who{width:26px;height:26px;border-radius:8px;background:var(--ai-soft);color:var(--ai);display:grid;place-items:center;flex:none}
.bb ul,.bb ol{margin:0;padding-left:20px}
.bb li+li{margin-top:2px}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opts button{height:32px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:0 12px;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px;color:var(--ink)}
.opts button:hover{border-color:var(--primary);color:var(--primary-text)}
.opts button.on{border-color:var(--primary);background:var(--primary-soft);color:var(--primary-text)}
.opts.done button{opacity:.55;pointer-events:none}
.ccard{border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.ccard .h{padding:10px 14px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:600;font-size:13px}
.ccard .b{padding:12px 14px;font-size:13px}
.typing{display:inline-flex;gap:4px;padding:8px 0}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--faint);animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.slides{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.slide{aspect-ratio:16/9;max-width:100%;border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:4px;background:var(--subtle-2);font-size:11px;overflow:hidden}
.slide b{font-size:12px}
.slide .bars{display:flex;align-items:flex-end;gap:3px;flex:1}
.slide .bars i{flex:1;background:var(--primary);opacity:.6;border-radius:2px}

/* ============ MAX PAGE & PANEL ============ */
.maxpage{display:grid;grid-template-columns:260px minmax(0,1fr);height:100%}
.maxhist{border-right:1px solid var(--line);background:var(--subtle-2);display:flex;flex-direction:column;min-height:0}
.maxhist .lst{overflow-y:auto;padding:8px;flex:1}
.maxhist .lst button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:7px;font-size:13px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.maxhist .lst button:hover{background:var(--hover)}
.maxhist .lst button.on{background:var(--primary-soft);color:var(--primary-text)}
.maxmain{display:flex;flex-direction:column;min-height:0}
.maxscroll{flex:1;overflow-y:auto;min-height:0}
.maxinner{max-width:780px;margin:0 auto;padding:28px 24px}
.maxfoot{padding:12px 24px 20px;border-top:1px solid var(--line-2)}
.maxfoot .aibox{max-width:780px;margin:0 auto}
.maxhello{text-align:center;padding:48px 0 24px;display:flex;flex-direction:column;align-items:center;gap:12px}
.orb{width:48px;height:48px;border-radius:14px;background:var(--ai-soft);color:var(--ai);display:grid;place-items:center;border:1px solid var(--ai-line)}
#maxpanel{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--pop);z-index:900;display:flex;flex-direction:column;animation:slidein var(--slow) var(--ease)}
@keyframes slidein{from{transform:translateX(24px);opacity:0}}
.mp-h{height:52px;display:flex;align-items:center;gap:8px;padding:0 12px 0 16px;border-bottom:1px solid var(--line)}
.mp-b{flex:1;overflow-y:auto;padding:16px;min-height:0}
.mp-f{padding:12px;border-top:1px solid var(--line-2)}
#maxfab{position:fixed;right:20px;bottom:20px;height:40px;padding:0 14px 0 12px;border-radius:10px;border:1px solid var(--ai-line);background:var(--surface);color:var(--ai);display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px;z-index:800;box-shadow:var(--pop);transition:transform var(--fast) var(--ease)}
#maxfab:hover{transform:scale(1.02)}
.guide-step{border:1px solid var(--ai-line);background:var(--ai-soft);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.guide-step ol{margin:0;padding-left:18px;font-size:13px;line-height:1.6}

/* ============ INBOX ============ */
.ibx{display:grid;grid-template-columns:340px minmax(0,1fr) 320px;height:100%;min-height:0}
.ibx.nopanel{grid-template-columns:340px minmax(0,1fr)}
.ib-l{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--surface)}
.ib-head{padding:12px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line-2)}
.ib-kind{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--subtle);padding:3px;border-radius:9px}
.ib-kind button{height:30px;border:0;background:none;border-radius:7px;font-weight:600;font-size:13px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px}
.ib-kind button.on{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.platf{display:flex;gap:4px;flex-wrap:wrap}
.platf label{display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 6px;border:1px solid var(--line);border-radius:6px;font-size:12px;cursor:pointer;user-select:none}
.platf label:has(input:checked){border-color:var(--primary);background:var(--primary-soft)}
.platf input{width:13px;height:13px}
.ib-list{flex:1;overflow-y:auto;min-height:0}
.ib-it{display:flex;gap:10px;padding:10px 12px;border:0;border-bottom:1px solid var(--line-2);width:100%;text-align:left;background:none;color:inherit}
.ib-it:hover{background:var(--subtle-2)}
.ib-it.on{background:var(--primary-soft)}
.ib-it .m{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.ib-it .l1{display:flex;gap:6px;align-items:center}
.ib-it .nmx{font-weight:600;font-size:13.5px}
.ib-it .tm{font-size:11px;color:var(--faint);margin-left:auto;flex:none}
.ib-it .pv{font-size:12.5px;color:var(--muted)}
.ib-it .l3{display:flex;gap:4px;align-items:center;flex-wrap:wrap;font-size:11px;color:var(--faint)}
.ib-it .ud{width:8px;height:8px;border-radius:50%;background:var(--primary);flex:none;margin-top:6px}
.avw{position:relative;flex:none}
.avw .plat{position:absolute;right:-4px;bottom:-4px;width:16px;height:16px;border:2px solid var(--surface);border-radius:5px}
.th{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--subtle-2)}
.th-h{display:flex;align-items:center;gap:10px;padding:0 16px;height:60px;border-bottom:1px solid var(--line);background:var(--surface);flex:none}
.th-b{flex:1;overflow-y:auto;min-height:0;padding:20px 24px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:min(520px,78%);display:flex;flex-direction:column;gap:3px;align-self:flex-start}
.msg.o{align-self:flex-end;align-items:flex-end}
.bub{padding:8px 11px 6px;border-radius:10px;background:var(--surface);border:1px solid var(--line);line-height:1.5;overflow-wrap:anywhere;font-size:13.5px;position:relative}
.msg.o .bub{background:var(--primary-soft);border-color:transparent}
.msg.o.hu .bub{background:var(--subtle);border-color:var(--line)}
.bub .ft{display:flex;align-items:center;justify-content:flex-end;gap:4px;font-size:10.5px;color:var(--faint);margin-top:2px}
.tick{color:var(--faint)}.tick.read{color:#34B7F1}
.meta{font-size:11px;color:var(--faint);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.sysev{align-self:center;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2);background:var(--surface);border:1px solid var(--line);padding:4px 10px;border-radius:8px;max-width:92%;text-align:center;flex-wrap:wrap;justify-content:center}
.sysev .ic{color:var(--primary)}
.sysev.stage{border-color:var(--primary-soft);background:var(--primary-soft);color:var(--primary-text)}
.sysev.hand{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.sysev.book{background:var(--in-soft);border-color:transparent;color:var(--in)}
.daysep{align-self:center;font-size:11px;color:var(--faint);font-weight:500;padding:4px 0}
.callc,.mailc,.quotec{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;width:min(440px,100%)}
.wave{display:flex;align-items:center;gap:10px}
.wave .pl{width:30px;height:30px;border-radius:50%;background:var(--primary);color:#fff;border:0;display:grid;place-items:center}
.wave svg{flex:1;height:26px}
.wave svg rect{fill:var(--primary);opacity:.35}
.tscript{font-size:12.5px;display:flex;flex-direction:column;gap:5px;border-top:1px solid var(--line-2);padding-top:8px}
.inchat{align-self:stretch;border:1px solid var(--ai-line);background:var(--ai-soft);border-radius:10px;padding:10px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px}
.inchat>.grow{flex:1 1 320px;min-width:220px}
.th-h .lnk{white-space:nowrap}
.inchat.book{border-color:transparent;background:var(--in-soft)}
.comp{border-top:1px solid var(--line);background:var(--surface);padding:10px 12px;display:flex;flex-direction:column;gap:8px;flex:none}
.comp textarea{min-height:44px;max-height:140px}
.ib-r{border-left:1px solid var(--line);background:var(--surface);overflow-y:auto;min-height:0;padding:16px;display:flex;flex-direction:column;gap:16px}
.kv{display:grid;grid-template-columns:92px minmax(0,1fr);gap:6px 10px;font-size:12.5px;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;overflow-wrap:anywhere;min-width:0}
.mback{display:none}
/* calls */
.dialer{display:grid;grid-template-columns:repeat(3,64px);gap:10px;justify-content:center}
.dialer button{height:52px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:20px;font-weight:500;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.dialer button small{font-size:9px;color:var(--faint);letter-spacing:.1em;margin-top:2px}
.dialer button:hover{background:var(--hover)}
.dialnum{font-size:24px;font-weight:600;text-align:center;letter-spacing:.02em;min-height:36px;border:0;background:none;width:100%;font-variant-numeric:tabular-nums}
.dialnum:focus{outline:none}
.callbtn{width:56px;height:56px;border-radius:50%;border:0;background:var(--good);color:#fff;display:grid;place-items:center}
.callbtn.end{background:var(--bad)}
.incall{display:flex;flex-direction:column;align-items:center;gap:12px;padding:24px;text-align:center}
.incall .ctl{display:grid;grid-template-columns:repeat(4,56px);gap:10px}
.incall .ctl button{height:56px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10.5px;color:var(--muted)}
.incall .ctl button.on{background:var(--primary-soft);color:var(--primary-text);border-color:var(--primary)}
/* email */
.mailx{display:grid;grid-template-columns:200px 360px minmax(0,1fr);height:100%;min-height:0}
.mf{border-right:1px solid var(--line);padding:12px 8px;display:flex;flex-direction:column;gap:2px;background:var(--surface)}
.mf button{display:flex;align-items:center;gap:8px;height:32px;padding:0 10px;border-radius:6px;border:0;background:none;font-size:13px;color:var(--ink-2);text-align:left}
.mf button:hover{background:var(--hover)}
.mf button.on{background:var(--primary-soft);color:var(--primary-text);font-weight:600}
.mf button .n{margin-left:auto;font-size:11px;color:var(--muted)}
.ml{border-right:1px solid var(--line);overflow-y:auto;min-height:0;background:var(--surface)}
.mi{display:flex;flex-direction:column;gap:2px;padding:10px 14px;border:0;border-bottom:1px solid var(--line-2);width:100%;text-align:left;background:none;color:inherit}
.mi:hover{background:var(--subtle-2)}
.mi.on{background:var(--primary-soft)}
.mi.unread .s,.mi.unread .f{font-weight:700}
.mr{overflow-y:auto;min-height:0;padding:24px 28px;background:var(--surface)}
.editor-tb{display:flex;gap:2px;flex-wrap:wrap;padding:4px;border:1px solid var(--line);border-bottom:0;border-radius:8px 8px 0 0;background:var(--subtle-2)}
.editor-tb button{width:28px;height:28px;border:0;background:none;border-radius:5px;font-weight:600;font-size:13px;color:var(--ink-2)}
.editor-tb button:hover{background:var(--hover)}
.editor{border:1px solid var(--line);border-radius:0 0 8px 8px;min-height:220px;padding:12px;outline:none;line-height:1.6;font-size:14px;background:var(--surface)}
.editor:focus{border-color:var(--primary)}
.att{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 8px;border:1px solid var(--line);border-radius:6px;font-size:12px;background:var(--subtle-2)}

/* ============ CONTACTS ============ */
.dq{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:16px}
.dq button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:2px;color:inherit;transition:border-color var(--fast) var(--ease)}
.dq button:hover{border-color:var(--primary)}
.dq b{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.dq span{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:5px}
.openbar{display:flex;align-items:center;gap:8px;padding:6px 8px 6px 12px;background:var(--primary-soft);color:var(--primary-text);border-radius:8px;font-size:13px;font-weight:500}
.chipf{display:inline-flex;align-items:center;height:28px;border:1px solid var(--line);background:var(--surface);border-radius:7px;overflow:hidden;font-size:12.5px}
.chipf.demo{border-style:dashed}
.chipf button{border:0;background:none;height:100%}
.chipf .t{padding:0 4px 0 10px;font-weight:500}
.chipf .x{padding:0 7px;color:var(--faint);display:grid;place-items:center}
.chipf .x:hover{color:var(--bad)}
.ftree{display:flex;flex-direction:column;gap:1px;font-size:13px}
.ftree button{display:flex;align-items:center;gap:6px;height:30px;border:0;background:none;border-radius:6px;text-align:left;color:var(--ink-2);padding-right:8px}
.ftree button:hover{background:var(--hover)}
.ftree button.on{background:var(--primary-soft);color:var(--primary-text);font-weight:500}
.ftree .c{margin-left:auto;font-size:11px;color:var(--faint)}
.fgridv{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.fold{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px;text-align:left;color:inherit;user-select:none;transition:border-color var(--fast) var(--ease)}
.fold:hover{border-color:var(--primary)}
.fold.sel{border-color:var(--primary);background:var(--primary-soft)}
.fold .fi{width:36px;height:30px;color:var(--primary)}
.fold .fi.grp{color:var(--warn)}
.fold b{font-size:13.5px;font-weight:600}
.hist-g{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);padding:12px 0 4px}
.hi{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;padding:8px 0;align-items:start}
.hic{width:28px;height:28px;border-radius:8px;display:grid;place-items:center}
.hic.chat{background:var(--primary-soft);color:var(--primary-text)}
.hic.call{background:var(--in-soft);color:var(--in)}
.hic.email{background:var(--out-soft);color:var(--out)}
.hic.sale{background:var(--good-soft);color:var(--good)}
.hic.stage{background:var(--ai-soft);color:var(--ai)}
.hic.book{background:var(--warn-soft);color:var(--warn)}
.hic.query{background:var(--subtle);color:var(--ink-2)}
.hic.sys{background:var(--subtle);color:var(--muted)}

/* ============ CAMPAIGNS / WIZARD ============ */
.ctile{padding:16px;display:flex;flex-direction:column;gap:12px}
.ctile .st{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ctile .st div{display:flex;flex-direction:column;min-width:0}
.ctile .st b{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
.ctile .st span{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wiz{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:20px;align-items:start}
.journey{position:sticky;top:16px;padding:16px}
.journey ol{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:2px}
.journey li button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:6px 8px;border-radius:7px;text-align:left;font-size:13px;color:var(--muted)}
.journey li button:hover{background:var(--hover)}
.journey li.on button{background:var(--primary-soft);color:var(--primary-text);font-weight:600}
.journey li.done button{color:var(--ink)}
.journey .dn{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line-strong);display:grid;place-items:center;font-size:11px;flex:none}
.journey li.done .dn{background:var(--primary);border-color:var(--primary);color:#fff}
.journey li.on .dn{border-color:var(--primary);color:var(--primary-text)}
.pick{border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;gap:12px;align-items:flex-start;background:var(--surface);text-align:left;width:100%;color:inherit;transition:border-color var(--fast) var(--ease)}
.pick:hover{border-color:var(--line-strong)}
.pick.on{border-color:var(--primary);background:var(--primary-soft)}
.pick .rd{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--line-strong);flex:none;margin-top:2px}
.pick.on .rd{border:5px solid var(--primary)}
.pick .cbx{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--line-strong);flex:none;margin-top:2px;display:grid;place-items:center;color:#fff}
.pick.on .cbx{background:var(--primary);border-color:var(--primary)}
.pick .ttl{font-weight:600;font-size:13.5px}
.pick .ds{font-size:12.5px;color:var(--muted)}
.picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.calpick{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;max-width:340px}
.calpick .dh{font-size:11px;color:var(--faint);text-align:center;padding:2px 0}
.calpick button{height:34px;border:1px solid var(--line);background:var(--surface);border-radius:6px;font-size:12.5px}
.calpick button.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.calpick button.pad{visibility:hidden}
.ab{display:grid;grid-template-columns:minmax(0,1fr) 60px;gap:10px;align-items:center;font-size:12.5px;padding:6px 0}

/* ============ STAGES ============ */
.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:12px;align-items:flex-start}
.bcol{flex:0 0 256px;background:var(--subtle-2);border:1px solid var(--line-2);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:6px;min-height:260px;transition:border-color var(--fast)}
.bcol.over{border-color:var(--primary);background:var(--primary-soft)}
.bcol-h{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px;padding:4px 6px}
.bcol-h .n{margin-left:auto;font-size:12px;color:var(--faint);font-weight:500}
.bcol-s{font-size:11.5px;color:var(--muted);padding:0 6px 4px}
.kc{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;cursor:grab;display:flex;flex-direction:column;gap:5px;text-align:left;width:100%;color:inherit;transition:border-color var(--fast),background var(--slow)}
.kc:hover{border-color:var(--line-strong)}
.kc.drag{opacity:.4}
.kc.flash{background:var(--primary-soft);border-color:var(--primary)}
.kc .t{font-weight:600;font-size:13px}
.kc .r{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:11.5px;color:var(--muted)}
.feed{display:flex;flex-direction:column}
.fe{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;padding:8px 0;border-bottom:1px solid var(--line-2);font-size:12.5px}
.fe:last-child{border-bottom:0}
.fe.new{animation:flash 1.6s var(--ease)}
@keyframes flash{0%{background:var(--primary-soft)}100%{background:transparent}}
.srow{display:grid;grid-template-columns:28px 1.1fr 1fr 90px auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line-2)}
.swatch{width:22px;height:22px;border-radius:6px;border:0}
.colors{display:flex;gap:6px;flex-wrap:wrap}
.colors button{width:24px;height:24px;border-radius:6px;border:2px solid transparent}
.colors button.on{border-color:var(--ink)}
.icons{display:flex;gap:4px;flex-wrap:wrap}
.icons button{width:30px;height:30px;border-radius:6px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink-2)}
.icons button.on{border-color:var(--primary);color:var(--primary-text);background:var(--primary-soft)}

/* ============ BOOKINGS ============ */
.calwrap{overflow-x:auto}
.cal{display:grid;min-width:calc(56px + var(--cols) * 140px);grid-template-columns:56px repeat(var(--cols),minmax(140px,1fr))}
.cal .hd{height:44px;padding:6px 8px;font-weight:600;font-size:12.5px;border-bottom:1px solid var(--line);background:var(--subtle-2);display:flex;flex-direction:column;justify-content:center}
.cal .hd span{font-weight:400;font-size:11px;color:var(--muted)}
.cal .hd.today{color:var(--primary-text)}
.times{position:relative;height:640px}
.times div{position:absolute;right:8px;font-size:11px;color:var(--faint);transform:translateY(-7px)}
.rc{position:relative;height:640px;border-left:1px solid var(--line-2);cursor:copy;background-image:repeating-linear-gradient(to bottom,var(--line-2) 0 1px,transparent 1px 32px)}
.bk{position:absolute;left:3px;right:3px;border-radius:6px;padding:3px 7px;font-size:11.5px;line-height:1.3;overflow:hidden;border:0;border-left:3px solid;text-align:left;display:flex;flex-direction:column;cursor:pointer}
.bk b{font-weight:600}
.s-requested{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.s-booked{background:var(--primary-soft);border-color:var(--primary);color:var(--primary-text)}
.s-arrived{background:var(--ai-soft);border-color:var(--ai);color:var(--ai)}
.s-completed{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.s-cancelled{background:var(--subtle);border-color:var(--faint);color:var(--faint);text-decoration:line-through}
.s-noshow{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.bk.flash{outline:2px solid var(--ai);animation:pop .5s var(--ease)}
@keyframes pop{0%{transform:scale(.94);opacity:0}100%{transform:none;opacity:1}}
.nowl{position:absolute;left:0;right:0;height:2px;background:var(--bad);pointer-events:none;z-index:2}
.month{display:grid;grid-template-columns:repeat(7,minmax(100px,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line);min-width:720px}
.month .dh{padding:6px 8px;font-size:11.5px;color:var(--muted);font-weight:500;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--subtle-2)}
.month .d{min-height:104px;padding:6px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:3px;cursor:pointer;background:var(--surface)}
.month .d:hover{background:var(--subtle-2)}
.month .d.o{background:var(--subtle-2);color:var(--faint)}
.month .d.today .dn{background:var(--primary);color:#fff}
.month .dn{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:600}
.month .it{font-size:11px;padding:1px 5px;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:2px solid}
.week7{display:grid;grid-template-columns:56px repeat(7,minmax(110px,1fr));min-width:860px}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px;border-left:3px solid}
.sim{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.lane{background:var(--subtle-2);border:1px solid var(--line-2);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px;font-size:12.5px;min-height:140px}
.lane code{font:11.5px var(--mono);background:var(--subtle);padding:1px 5px;border-radius:4px}

/* ============ AGENTS ============ */
.atypes{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin-bottom:16px}
.atype{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;display:flex;align-items:center;gap:10px;text-align:left;color:inherit;transition:border-color var(--fast)}
.atype:hover{border-color:var(--line-strong)}
.atype.on{border-color:var(--primary);background:var(--primary-soft)}
.atype .ico{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--subtle);color:var(--ink-2);flex:none}
.atype.on .ico{background:var(--primary);color:#fff}
.atype b{font-size:13px;display:block}
.atype span{font-size:11.5px;color:var(--muted)}
.atile{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;text-align:left;color:inherit;transition:border-color var(--fast)}
.atile:hover{border-color:var(--line-strong)}
.atile.on{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.atile .mt{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.atile .mt b{font-size:15px;font-weight:700;display:block;font-variant-numeric:tabular-nums}
.atile .mt span{font-size:11px;color:var(--muted)}
.gscore{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);background:var(--subtle-2);border-radius:8px;padding:6px 8px}
.aed{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;align-items:start}
.aed-nav{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);padding:0 12px}
.aed-sec{padding:20px}
.acc{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.acc+.acc{margin-top:8px}
.acc>button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:var(--surface);padding:12px 14px;text-align:left;font-weight:600;font-size:13.5px}
.acc>button:hover{background:var(--subtle-2)}
.acc>button .st{margin-left:auto;display:flex;align-items:center;gap:6px}
.acc .ab2{padding:4px 14px 16px;display:flex;flex-direction:column;gap:14px;border-top:1px solid var(--line-2);padding-top:14px}
.catg{border:1px solid var(--line);border-radius:10px;padding:4px 14px;margin-bottom:10px}
.catg .group-h{padding-top:10px}
.review{display:flex;gap:14px;align-items:center}
.sugl{display:flex;flex-direction:column;gap:6px}
.sugi{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;padding:8px 10px;border-radius:8px;background:var(--subtle-2);border:1px solid var(--line-2)}
.sugi .ic{margin-top:2px}
.sugi.bad .ic{color:var(--bad)}.sugi.warn .ic{color:var(--warn)}.sugi.good .ic{color:var(--good)}
.testp{display:flex;flex-direction:column;height:480px}
.tlog{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--subtle-2);min-height:0}
.tmsg{max-width:88%;padding:7px 10px;border-radius:10px;font-size:13px;line-height:1.45;background:var(--surface);border:1px solid var(--line)}
.tmsg.me{align-self:flex-end;background:var(--primary-soft);border-color:transparent}
.tool{align-self:flex-start;font:11.5px/1.5 var(--mono);color:var(--ink-2);background:var(--subtle);padding:4px 8px;border-radius:6px;display:flex;gap:6px;align-items:flex-start;max-width:100%;overflow-wrap:anywhere}
.tool .ic{color:var(--ai);margin-top:2px}
.hint{align-self:stretch;font-size:12px;padding:6px 10px;border-radius:8px;background:var(--warn-soft);color:var(--warn);display:flex;gap:6px;align-items:flex-start}
.kbf{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.creating{display:flex;flex-direction:column;align-items:center;gap:20px;padding:32px 20px;text-align:center}
.cr-orb{width:120px;height:120px;border-radius:50%;position:relative;display:grid;place-items:center}
.cr-orb::before{content:'';position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,var(--primary),var(--ai),#F59E0B,var(--in),var(--primary));animation:spin 2.4s linear infinite;opacity:.9}
.cr-orb::after{content:'';position:absolute;inset:8px;border-radius:50%;background:var(--surface)}
.cr-orb .in2{position:relative;z-index:1;width:64px;height:64px;border-radius:18px;background:var(--ai-soft);color:var(--ai);display:grid;place-items:center;animation:bob 1.6s var(--ease) infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bob{50%{transform:translateY(-4px)}}
.crsteps{display:flex;flex-direction:column;gap:8px;text-align:left;min-width:260px}
.crsteps div{display:flex;gap:10px;align-items:center;font-size:13.5px;color:var(--muted)}
.crsteps div.dn{color:var(--ink)}
.crsteps .ok{width:18px;height:18px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center}
.spin{width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--ai);border-radius:50%;animation:spin .8s linear infinite;flex:none}
.lb{display:grid;grid-template-columns:32px minmax(0,1.4fr) repeat(6,minmax(70px,1fr));gap:8px;align-items:center}

/* ============ REPORTS / EXPENSES / PRICING ============ */
.total{display:flex;align-items:flex-end;gap:24px;flex-wrap:wrap}
.total .big{font-size:40px;font-weight:700;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums}
.docv{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px;font-size:14px;line-height:1.6}
.docv h2{margin-top:8px}
.plans{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.plan{padding:24px;display:flex;flex-direction:column;gap:14px}
.plan.hot{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.plan .pr{font-size:30px;font-weight:700;letter-spacing:-.02em}
.plan ul{margin:0;padding-left:18px;font-size:13px;line-height:1.8;color:var(--ink-2)}
.setx{display:grid;grid-template-columns:230px minmax(0,1fr);gap:28px;align-items:start}
.setnav{display:flex;flex-direction:column;gap:1px;position:sticky;top:0}
.setnav .g{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);padding:14px 10px 4px}
.setnav button{display:flex;align-items:center;gap:9px;height:30px;padding:0 10px;border-radius:6px;border:0;background:none;color:var(--ink-2);font-size:13px;text-align:left;white-space:nowrap}
.setnav button:hover{background:var(--hover)}
.setnav button.on{background:var(--primary-soft);color:var(--primary-text);font-weight:500}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.thm{border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--surface);text-align:left;display:flex;flex-direction:column;gap:8px;color:inherit}
.thm.on{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.thm .pv{height:64px;border-radius:6px;display:grid;grid-template-columns:28% 1fr;overflow:hidden;border:1px solid var(--line-2)}
.gs{display:flex;flex-direction:column;gap:0}
.gsi{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:14px;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line-2)}

/* ============ OVERLAYS ============ */
.mb{position:fixed;inset:0;background:rgba(10,14,22,.42);display:grid;place-items:center;padding:16px;z-index:1000;animation:fade var(--std) var(--ease)}
@keyframes fade{from{opacity:0}}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:12px;width:min(680px,100%);max-height:calc(100dvh - 32px);display:flex;flex-direction:column;box-shadow:var(--pop);overflow:hidden}

#tip{position:fixed;z-index:20000;background:var(--tip);color:var(--tip-ink);font-size:12px;line-height:1.45;padding:6px 9px;border-radius:6px;max-width:280px;pointer-events:none;opacity:0;transition:opacity var(--fast) var(--ease)}
#tip.on{opacity:1}
#tip b{font-weight:600}
#ctx{position:fixed;z-index:5000;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--pop);padding:4px;min-width:200px}
#ctx button{display:flex;align-items:center;gap:8px;width:100%;height:32px;border:0;background:none;border-radius:6px;padding:0 10px;font-size:13px;text-align:left;color:var(--ink)}
#ctx button:hover{background:var(--hover)}

.pop{position:fixed;z-index:4000;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--pop);width:min(380px,calc(100% - 24px));max-height:70vh;overflow-y:auto}
#toasts{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:30000;width:max-content;max-width:calc(100% - 32px);pointer-events:none}
.toast{background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:9px;font-size:13px;box-shadow:var(--pop);display:flex;gap:8px;align-items:center;animation:tin var(--slow) var(--ease)}
.toast.ai .ic{color:#B9A6FF}
.toast.out{opacity:0;transform:translateY(6px);transition:all var(--slow)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
.voice{display:flex;flex-direction:column;align-items:center;gap:18px;padding:24px 8px}
.vorb{width:140px;height:140px;border-radius:50%;background:radial-gradient(circle at 35% 35%,var(--primary-soft),var(--ai-soft));border:1px solid var(--ai-line);display:grid;place-items:center;color:var(--ai);animation:breathe 2s var(--ease) infinite}
@keyframes breathe{50%{transform:scale(1.05)}}
